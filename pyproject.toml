[project]
name = "finalproject-stepanov-m26-555"
version = "0.1.0"
description = "ValutaTrade Hub: консольная платформа для отслеживания и симуляции торговли фиатными и криптовалютами"
readme = "README.md"
authors = [
    { name = "Stepanov Alexandr", email = "36171529+c3alex@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B"]

[tool.valutatrade]
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
history_file = "data/exchange_rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
log_level = "INFO"
log_format = "text"
log_max_bytes = 1048576
log_backup_count = 5

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
